name: Deploy site to GitHub Pages
# Publishes the static site in public/ (landing page + player and host apps).
# The multiplayer game itself needs the Node server (see README). If you host it somewhere,
# set a repository variable APP_URL (e.g. https://my-game.onrender.com) and the Pages site will use it.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the site at the game server
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          printf "window.MM_API = '%s';\n" "$APP_URL" > public/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deployment
        uses: actions/deploy-pages@v4
